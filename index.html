<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Session 1 – Introductions</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--y:#D99A00;--yd:#A87500;--yl:#FFF3CC;--k:#111;--g:#2E9E5B;--r:#D64545;color-scheme:light;box-sizing:border-box}
*{box-sizing:border-box}html,body{height:100%;margin:0;background:#fff;font-family:Poppins,'Segoe UI',Arial,sans-serif;color:var(--k);overflow:hidden}
#st{width:1280px;height:720px;position:absolute;left:50%;top:50%;background:#fff;overflow:hidden;transform-origin:center}
#st:before{content:"";position:absolute;left:0;top:0;width:330px;height:130px;background:var(--y);clip-path:polygon(0 0,100% 0,0 100%)}
#st:after{content:"";position:absolute;right:0;bottom:0;width:150px;height:70px;background:var(--k);clip-path:polygon(100% 0,100% 100%,0 100%)}
.tag{position:absolute;left:30px;top:24px;font-weight:800;font-size:14px;letter-spacing:.1em;z-index:3;max-width:230px}
#hud{position:absolute;right:26px;top:18px;display:flex;gap:10px;z-index:5}#hud b{background:var(--k);color:#fff;border-radius:20px;padding:6px 16px;font-size:18px}#hud b+b{background:var(--y);color:var(--k)}
#bar{position:absolute;left:0;bottom:0;height:8px;background:var(--y);transition:width .4s;z-index:4}
#nav{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);display:flex;gap:14px;align-items:center;z-index:5;font-weight:700}
#nav button{width:48px;height:48px;border-radius:50%;border:3px solid var(--k);background:#fff;font-size:20px;cursor:pointer}#nav button:hover{background:var(--y)}
.c{position:absolute;inset:92px 64px 76px;display:flex;flex-direction:column}
h1{font-size:76px;line-height:1.05;margin:0 0 14px;font-weight:800}h1 span{color:var(--y)}h2{font-size:40px;font-weight:800;margin:0 0 14px}
.sub{font-size:24px;margin:0 0 28px}.big{font-size:200px;text-align:center}.grow{flex:1}.row{display:flex;gap:36px;align-items:center;flex:1;min-height:0}
.bt{background:var(--y);border:3px solid var(--k);border-radius:16px;padding:12px 30px;font:800 22px Poppins,Arial;cursor:pointer;box-shadow:0 5px 0 var(--k)}.bt:active{transform:translateY(4px);box-shadow:0 1px 0 var(--k)}
.gh{background:#fff;border:2px solid var(--k);border-radius:12px;padding:6px 16px;font:600 16px Poppins,Arial;cursor:pointer;margin-top:12px;align-self:flex-start}
.cov{display:flex;align-items:center;justify-content:space-between;height:100%}.cov .big{font-size:240px}
.pic{width:440px;height:100%;max-height:480px;object-fit:cover;border-radius:24px;border:4px solid var(--k)}
.grid{display:grid;gap:18px;flex:1;min-height:0}
.og{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;flex:1}.og div{background:var(--yl);border:3px solid var(--k);border-radius:20px;padding:16px;font-size:22px;font-weight:700;text-align:center;display:flex;flex-direction:column;justify-content:center;gap:6px;cursor:pointer}.og div span{font-size:54px}.og div.t{background:var(--y)}
.sec{text-align:center;margin:auto}.sec .n{font-size:30px;font-weight:800;letter-spacing:.2em}.sec h1{font-size:84px}.pg{display:flex;gap:10px;justify-content:center;margin-top:20px}.pg i{width:34px;height:12px;border-radius:6px;background:#ddd}.pg i.d{background:var(--y)}
.card{perspective:900px;cursor:pointer}.in{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}.card.on .in{transform:rotateY(180deg)}
.f,.b{backface-visibility:hidden;position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;border-radius:22px;padding:14px;border:3px solid var(--k)}
.f{background:var(--y);font-size:30px;font-weight:800}.b{background:var(--k);color:#fff;transform:rotateY(180deg);font-size:28px;font-weight:700}.b small{color:var(--y);font-size:20px;margin-top:8px}
.dots{display:flex;gap:8px;margin-bottom:12px}.dots i{width:30px;height:10px;border-radius:5px;background:#ddd}.dots i.d{background:var(--g)}.dots i.cur{background:var(--y)}
.q{font-size:32px;font-weight:700;margin:6px 0 18px}.opts{display:flex;flex-wrap:wrap;gap:14px}
.op,.chip{background:#fff;border:3px solid var(--k);border-radius:16px;padding:12px 24px;font:700 26px Poppins,Arial;cursor:pointer;box-shadow:0 4px 0 var(--k)}.op:hover:not(:disabled),.chip:hover{background:var(--yl)}
.op.ok,.chip.on{background:var(--g);color:#fff;border-color:var(--k)}.op.sel{background:var(--y)}.op.l.lock{background:var(--g);color:#fff}.op.bad{background:var(--r);color:#fff}.op:disabled{cursor:default}
.no{animation:sk .4s}@keyframes sk{25%{transform:translateX(-9px)}75%{transform:translateX(9px)}}
.fb{font-size:22px;font-weight:600;min-height:30px;color:var(--yd)}
.sp{border:2px solid var(--k);background:var(--y);border-radius:50%;width:42px;height:42px;font-size:20px;cursor:pointer;vertical-align:middle}
.fl{position:fixed;z-index:99;font-size:30px;font-weight:800;color:var(--g);pointer-events:none;animation:up .9s forwards}@keyframes up{to{transform:translateY(-70px);opacity:0}}
.slot{min-height:74px;border:3px dashed var(--k);border-radius:16px;padding:10px 16px;font-size:30px;font-weight:700;margin-bottom:18px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.mt{display:flex;gap:90px;justify-content:center;flex:1;align-items:center}.col{display:flex;flex-direction:column;gap:12px}.col .op{min-width:150px}
.pill{background:var(--y);border:3px solid var(--k);border-radius:18px;padding:12px 22px;font-size:28px;font-weight:700}.pill.k{background:var(--k);color:#fff;cursor:pointer}
.qa{display:grid;grid-template-columns:1fr 1fr;gap:22px;align-items:center;flex:1}
.dl{display:flex;flex-direction:column;gap:3px;flex:1;overflow:hidden}.bub{font-size:17px;padding:2px 12px;border-radius:14px;background:#f2f2f2;max-width:640px}.bub b{color:var(--yd)}.bub.a{background:var(--yl);align-self:flex-end}
.tb{border-collapse:separate;border-spacing:10px;width:100%;flex:1}.tb th{font-size:30px}.tb td{background:var(--yl);border:3px solid var(--k);border-radius:14px;padding:10px;text-align:center;font-size:21px;font-weight:600;cursor:pointer}.tb td.h{background:var(--y);font-weight:800;cursor:default}.tb td.sh{background:var(--k);color:#fff}
.list{display:flex;flex-direction:column;gap:12px}.li{display:flex;align-items:center;gap:14px;font-size:32px;font-weight:700;background:var(--yl);border:3px solid var(--k);border-radius:16px;padding:10px 20px;cursor:pointer}mark{background:var(--y);padding:0 8px;border-radius:8px}
.steps{font-size:30px;font-weight:600;padding-left:34px;margin:0}.steps li{margin-bottom:12px}
.bn{position:absolute;right:0;top:-34px;font-size:50px}
.price{background:#fff;border:3px solid var(--k);border-radius:14px;font:800 34px Poppins;padding:8px;cursor:pointer;text-align:center}.price small{display:block;font-size:13px;letter-spacing:3px;font-weight:400}
.done{margin:auto;text-align:center}.done .big{font-size:120px}
#ov{position:absolute;inset:0;background:rgba(255,255,255,.97);z-index:20;padding:60px 90px;font-size:22px;display:none;overflow:auto}
.lk{position:absolute;left:270px;bottom:10px;font-size:15px;font-weight:700;color:var(--k);z-index:5}
.t3{display:grid;grid-template-columns:1fr 1fr;gap:18px;flex:1}.t3 a,.t3 div{background:var(--yl);border:3px solid var(--k);border-radius:18px;padding:14px 20px;font-size:21px;font-weight:600;color:var(--k);text-decoration:none}.t3 b{display:block;font-size:24px}
.pl{display:inline-block;background:var(--yl);border:2px solid var(--k);border-radius:14px;padding:4px 14px;font-size:20px;font-weight:700}
.tb2{border-collapse:collapse;width:100%;margin-top:10px}.tb2 th,.tb2 td{border:3px solid var(--k);height:44px;font-size:21px;text-align:center}.tb2 th{background:var(--y)}
.dl.rv .wq{text-decoration:underline;text-decoration-color:var(--y);text-decoration-thickness:4px;font-weight:700}
.ful{width:100%;height:100%;object-fit:cover}.pw{width:620px;height:auto;max-height:420px;object-fit:contain;border-radius:14px}
#st.nt:before,#st.nt:after{display:none}
#tn{position:absolute;left:64px;bottom:0;height:34px;padding:0 18px;border-radius:12px 12px 0 0;border:2px solid var(--k);border-bottom:0;background:var(--yl);font:700 15px Poppins,Arial;cursor:pointer;z-index:16}#tn:hover{background:var(--y)}
#tp{position:absolute;left:0;right:0;bottom:0;height:340px;background:#fff;border-top:6px solid var(--y);padding:14px 150px 24px 64px;overflow:auto;z-index:15;transform:translateY(101%);transition:transform .35s;font-size:18px;line-height:1.45}#tp.open{transform:none;box-shadow:0 -8px 24px rgba(0,0,0,.18)}
#tp p{margin:0 0 8px}#tp h3{margin:0 0 8px;font-size:20px;color:var(--yd)}#tp .gh{position:absolute;right:24px;top:10px;margin:0}
</style></head><body>
<div id="st"><div class="tag"></div><div id="hud"><b id="sk">🔥 0</b><b id="xp">⭐ 0</b></div><div class="c" id="c"></div><div id="ov"></div><button id="tn" aria-label="Teacher script" title="Teacher notes (T)">▲ Teacher notes</button><div id="tp"><button class="gh" id="tx">✕ Hide</button><div id="tc"></div></div><div id="bar"></div>

const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const sh=a=>[...a].sort(()=>Math.random()-.5),im=(k,c='pic')=>`<img class="${c}" src="${IMG[k]}" alt="">`;
const say=t=>{try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.85;speechSynthesis.speak(u)}catch(e){}};
const sp=t=>`<button class="sp" onclick="event.stopPropagation();say(this.dataset.t)" data-t="${t.replace(/"/g,'&quot;')}" aria-label="Listen">🔊</button>`;
let i=0,xp=0,st=0;
function hud(){$('#xp').textContent='⭐ '+xp;$('#sk').textContent='🔥 '+st}
function ok(el,n=10){n+=st>1?5:0;st++;xp+=n;hud();const r=el.getBoundingClientRect(),f=document.createElement('b');f.className='fl';f.textContent='+'+n;f.style.left=(r.left+r.width/2)+'px';f.style.top=r.top+'px';document.body.append(f);setTimeout(()=>f.remove(),900)}
function bad(el){st=0;hud();el.classList.add('no');setTimeout(()=>el.classList.remove('no'),500)}
function fin(c,m){c.innerHTML=`<div class="done"><div class="big">🏆</div><h2>${m||'Round complete!'}</h2><button class="bt" onclick="go(i+1)">Next ▶</button></div>`;xp+=20;hud()}
const R={},NV=()=>`<div class="opts"><button class="gh" id="pv">◀ Previous</button><button class="gh" id="nx">Next ▶</button></div>`;
R.cover=(d,c)=>c.innerHTML=`<div class="cov"><div><h1>Welcome to <span>S01</span></h1><p class="sub">Introductions · Feelings · The verb to be · Prices · Wh-questions</p><button class="bt" onclick="go(1)">Start the session ▶</button></div><div class="big">👋</div></div>`;
R.obj=(d,c)=>{c.innerHTML=`<h2>Session objectives</h2><p class="sub" style="margin-bottom:12px">By the end of this session, you can…</p><div class="og">${d.o.map(([e,t])=>`<div><span>${e}</span>${t}</div>`).join('')}</div>`;$$('.og div',c).forEach(x=>x.onclick=()=>{if(!x.classList.contains('t')){x.classList.add('t');ok(x,5)}})};
R.sec=(d,c)=>c.innerHTML=`<div class="sec"><div class="n">MISSION ${d.n} OF 7</div><div class="big" style="font-size:140px">${d.e}</div><h1>${d.t}</h1><div class="pg">${[1,2,3,4,5,6,7].map(n=>`<i class="${n<=d.n?'d':''}"></i>`).join('')}</div></div>`;
R.who=(d,c)=>{const p=[['👤','name'],['🎂','age'],['🌍','country / nationality'],['🏙️','city'],['💼','job']];
c.innerHTML=`<h2>Do you know him? What do we want to know?</h2><div class="row"><div class="opts" style="flex:1">${p.map(([e,t])=>`<button class="op" style="font-size:28px;min-width:150px" data-e="${e}" data-t="${t}">❓</button>`).join('')}</div>${im('man')}</div>`;
$$('.op',c).forEach(b=>b.onclick=()=>{if(!b.classList.contains('ok')){b.classList.add('ok');b.textContent=b.dataset.e+' '+b.dataset.t;ok(b)}})};
R.cards=(d,c)=>{c.innerHTML=`<h2>${d.h}</h2><div class="grid" style="grid-template-columns:repeat(${d.cols},1fr)">${d.items.map(([f,b,s])=>`<div class="card"><div class="in"><div class="f">${f}</div><div class="b">${b}<small>${s||''}</small></div></div></div>`).join('')}</div>`;
